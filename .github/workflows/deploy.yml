name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Meia hora depois de cada rodada do pipeline de dados (a cada 3 horas)
    - cron: '30 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Atualiza os dados do dashboard com a última execução do pipeline.
      # Se falhar, o build segue com o snapshot que já está em public/dados.
      - name: Atualizar dados do pipeline
        run: |
          for f in crypto_market.csv crypto_historico.csv clima_diario.csv economia_diario.csv metadata.json; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/Dados/main/data/serving/powerbi/$f" -o "public/dados/$f.tmp" \
              && mv "public/dados/$f.tmp" "public/dados/$f" \
              || echo "Mantendo snapshot de $f"
          done
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
